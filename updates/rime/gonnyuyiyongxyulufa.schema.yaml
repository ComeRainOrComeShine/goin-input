# Rime schema
# encoding: utf-8

schema:
  schema_id: gonnyuyiyongxyulufa
  name: "弋阳话"
  version: "2026.07.18-simplified-rare-low"
  author:
    - "赣语通讯社"
  description: |
    弋阳赣语表码方案。
    依据《弋阳字表》的本地读音和中古小韵同音字关系整理，
    使用独立弋阳词典，不引用分宜版读音规则。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: simplification
    reset: 1
    states: [ 漢字, 汉字 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator@custom_phrase
    - script_translator
  filters:
    - simplifier
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"

translator:
  dictionary: gonnyuyiyongxyulufa
  user_dict: gonnyuyiyongxyulufa
  db_class: userdb
  enable_charset_filter: false
  enable_completion: true
  enable_encoder: true
  encode_commit_history: true
  enable_sentence: true
  enable_user_dict: true
  max_phrase_length: 8
  comment_format:
    - xform/^/[/
    - xform/$/]/

custom_phrase:
  dictionary: ""
  user_dict: custom_phrase_gonnyuyiyongxyulufa
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 1

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    punct: "^/([0-9]0?|[A-Za-z]+)$"
