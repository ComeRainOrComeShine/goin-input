# Rime schema
# encoding: utf-8

schema:
  schema_id: liuyang
  name: "浏阳版"
  version: "2026.06.24-fenyi-transfer"
  author:
    - "Generated from Fenyi dictionary and Liuyang batch replacement table"
  description: |
    浏阳赣语表码方案。
    以浏阳已填样字为优先，结合中古音类和分宜成熟词库批量推导。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator@custom_phrase
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"

translator:
  dictionary: liuyang
  user_dict: liuyang
  db_class: userdb
  enable_charset_filter: false
  enable_completion: true
  enable_encoder: true
  encode_commit_history: true
  enable_sentence: true
  enable_user_dict: true
  max_phrase_length: 8
  comment_format:
    - xform/^/[/
    - xform/$/]/

custom_phrase:
  dictionary: ""
  user_dict: custom_phrase_liuyang
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 1

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    punct: "^/([0-9]0?|[A-Za-z]+)$"
