# Rime schema
# encoding: utf-8

schema:
  schema_id: gan_nanchang_ganxi_mixed
  name: 赣语-昌宜兼容
  version: '0.2.15-test-20260609'
  author:
    - 贛語通訊社
  description: |
    赣语-昌宜兼容 Rime 方案 v0.1.1。
    当前以“赣西分宜基础音”为底本复制，供后续扩展赣语-昌宜兼容。
    需要配合 gan_nanchang_ganxi_mixed.dict.yaml 使用。
  dependencies:
    - stroke

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: simplification
    states: [ 漢字, 汉字 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator@custom_phrase
    - reverse_lookup_translator
    - script_translator
  filters:
    - simplifier
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - derive/(^| )jiy/$1jy/
    - derive/(^| )yi/$1i/
    - derive/(^| )ya/$1ia/
    - derive/(^| )ya/$1yia/
    - derive/(^| )yo/$1io/
    - derive/(^| )yo/$1yio/
    - derive/(^| )ye/$1ie/
    - derive/(^| )ye/$1yie/
    - derive/(^| )ye/$1yue/
    - derive/(^| )yue/$1iye/
    - derive/(^| )yun/$1iyn/
    - derive/(^| )yu/$1iy/
    - derive/(^| )yeu/$1ieu/
    - derive/(^| )yeu/$1iao/
    - derive/(^| )yeu/$1yao/
    - derive/(^| )yan/$1ien/
    - derive/(^| )yan/$1yen/
    - derive/(^| )yon/$1ion/
    - derive/(^| )yon/$1ioin/
    - derive/(^| )yon/$1yoin/
    - derive/(^| )yang/$1iang/
    - derive/(^| )yong/$1iong/
    - derive/(^| )you/$1iu/
    - derive/(^| )yin/$1in/
    - derive/(^| )yun/$1yn/
    - derive/(^| )wa/$1ua/
    - derive/(^| )wo/$1uo/
    - derive/(^| )we/$1ue/
    - derive/(^| )wai/$1uai/
    - derive/(^| )woi/$1uoi/
    - derive/(^| )wei/$1uei/
    - derive/(^| )wan/$1uan/
    - derive/(^| )won/$1uon/
    - derive/(^| )won/$1uoin/
    - derive/(^| )won/$1woin/
    - derive/(^| )wen/$1uen/
    - derive/(^| )wang/$1uang/
    - derive/(^| )wong/$1uong/
    - derive/(^| )weng/$1ueng/
    - derive/(^| )yng/$1yong/
    - derive/(^| )ngau/$1ngao/
    - derive/(^| )ngon/$1ngoin/
    - derive/(^| )nyon/$1yon/
    - derive/(^| )yon/$1nyon/
    - derive/([bpmfdtnlgkhzcsjqxr])ui/$1uei/
    - derive/([bpmfdtnlgkhzcsjqxr])un/$1uen/
    - derive/([jqx])i/$1/
    - derive/y/v/

translator:
  dictionary: gan_nanchang_ganxi_mixed

custom_phrase:
  dictionary: ""
  user_dict: custom_phrase_gan_nanchang_ganxi_mixed
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 1

reverse_lookup:
  dictionary: stroke
  enable_completion: true
  prefix: "`"
  suffix: "'"
  tips: 〔筆畫〕
  preedit_format:
    - xlit/hspnz/一丨丿丶乙/
  comment_format:
    - xform/([nl])v/$1ü/

punctuator:
  import_preset: symbols

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    punct: '^/([0-9]0?|[A-Za-z]+)$'
    reverse_lookup: "`[a-z]*'?$"

__patch:
  # 使用八股文語言模型
  - grammar:/hant?
